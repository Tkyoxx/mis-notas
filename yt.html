<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Video</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    iframe {
      position: absolute; left: 50%; top: 50%; width: 100%; height: 100%; border: 0;
      transform: translate(-50%, -50%) scale(1.22); pointer-events: none;
    }
  </style>
</head>
<body>
  <script>
    const q = new URLSearchParams(location.search);
    const id = q.get('v') || '';
    if (/^[\w-]{11}$/.test(id)) {
      const p = new URLSearchParams({
        autoplay: 1, mute: 1, controls: 0, disablekb: 1, fs: 0, playsinline: 1, rel: 0, modestbranding: 1,
        iv_load_policy: 3,
        cc_load_policy: 0,
        cc_lang_pref: 'zz',
        hl: 'es', color: 'white', loop: 1, playlist: id, enablejsapi: 1,
        start: Math.max(0, parseInt(q.get('start'), 10) || 0), origin: location.origin,
      });
      const f = document.createElement('iframe');
      f.allow = 'autoplay; encrypted-media';
      f.title = 'Video musical';
      f.tabIndex = -1;
      f.src = `https://www.youtube-nocookie.com/embed/${id}?${p}`;
      document.body.appendChild(f);
      addEventListener('message', e => {
        if (e.source === parent && e.source !== window) f.contentWindow?.postMessage(e.data, '*');
        else if (e.source === f.contentWindow) parent.postMessage(e.data, '*');
      });
      f.addEventListener('load', () => parent.postMessage(JSON.stringify({ event: 'bridgeReady' }), '*'));
    }
  </script>
</body>
</html>
